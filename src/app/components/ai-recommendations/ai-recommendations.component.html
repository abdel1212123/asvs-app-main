<div class="ai-panel">

  <!-- Panel Header -->
  <div class="ai-header">
    <div class="ai-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.818a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.845-.143z" clip-rule="evenodd" />
      </svg>
    </div>
    <div>
      <div class="ai-header-tag mono">AI ENGINE</div>
      <h2 class="ai-header-title">Smart Recommendations</h2>
    </div>
  </div>

  <!-- Description -->
  <p class="ai-desc">Get AI-powered guidance on unimplemented security controls for your target level.</p>

  <!-- API Key Input -->
  <div class="ai-field">
    <label class="ai-label mono">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:12px;height:12px">
        <path fill-rule="evenodd" d="M15.75 1.5a6.75 6.75 0 00-6.651 7.906c.067.39-.032.717-.221.906l-6.5 6.499a3 3 0 00-.878 2.121v2.818c0 .414.336.75.75.75H6a.75.75 0 00.75-.75v-1.5h1.5A.75.75 0 009 19.5V18h1.5a.75.75 0 00.53-.22l2.658-2.658c.19-.189.517-.288.906-.22A6.75 6.75 0 1015.75 1.5zm0 3a.75.75 0 000 1.5A2.25 2.25 0 0118 8.25a.75.75 0 001.5 0 3.75 3.75 0 00-3.75-3.75z" clip-rule="evenodd" />
      </svg>
      API KEY — OPTIONAL
    </label>
    <input type="password" [(ngModel)]="apiKey" placeholder="AIzaSy..."
      class="ai-input mono"/>
  </div>

  <!-- Generate button -->
  <button (click)="generateRecommendations()" [disabled]="isGenerating" class="ai-btn">
    <span *ngIf="!isGenerating" class="ai-btn-content">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.818a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.845-.143z" clip-rule="evenodd" />
      </svg>
      <span class="mono">ANALYZE LEVEL {{ currentLevel }}</span>
    </span>
    <span *ngIf="isGenerating" class="ai-btn-content">
      <svg class="ai-spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="mono">PROCESSING...</span>
    </span>
  </button>

  <!-- Error -->
  <div *ngIf="error" class="ai-error mono">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;flex-shrink:0">
      <path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd" />
    </svg>
    {{ error }}
  </div>

  <!-- Divider -->
  <div *ngIf="recommendationsHtml && !isGenerating" class="ai-divider">
    <span class="mono">// ANALYSIS RESULTS</span>
  </div>

  <!-- Results -->
  <div *ngIf="recommendationsHtml && !isGenerating" class="ai-results">
    <div class="ai-results-inner" [innerHTML]="recommendationsHtml"></div>
  </div>

</div>
